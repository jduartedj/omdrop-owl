plugins { id 'com.android.application' }

android {
    namespace 'org.omdrop.android'
    compileSdk 36
    ndkVersion '27.3.13750724'
    if (providers.gradleProperty('omdrop.ndkPath').isPresent()) { ndkPath providers.gradleProperty('omdrop.ndkPath').get() }
    defaultConfig {
        applicationId 'org.omdrop.android'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.1.0-gate'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=none' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.28.3' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        // Reproducibly pinned toolchain; intentionally ARM64 Samsung-only, not ChromeOS.
        disable 'AndroidGradlePluginVersion', 'ChromeOsAbiSupport'
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
